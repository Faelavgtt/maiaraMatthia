name = "maiaramatthia"
main = "worker/src/index.ts"
compatibility_date = "2026-07-16"

[vars]
APP_ORIGIN = "http://localhost:8080"
ADMIN_EMAILS = ""
WHATSAPP_NUMBER = ""

[assets]
directory = "./dist/"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "maiara-order-files"

name = "maiaramatthia"
main = "worker/src/index.ts"
compatibility_date = "2026-07-16"

[vars]
APP_ORIGIN = "http://localhost:8080"
ADMIN_EMAILS = ""
WHATSAPP_NUMBER = ""

[[d1_databases]]
binding = "DB"
database_name = "maiara_orders"
# Replace with the UUID shown in Cloudflare D1 > maiara_orders.
database_id = "TODO_D1_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "maiara-order-files"
